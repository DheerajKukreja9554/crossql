# CrossQL - Connection Configuration
# Copy this file to connections.yaml and fill in your values.
# connections.yaml is gitignored - never commit real credentials.
#
# Each environment points to a PostgreSQL server.
# CrossQL auto-discovers all databases on the server.
# Password supports ${ENV_VAR} interpolation, e.g. password: "${PROD_DB_PASS}"

environments:
  development:
    host: localhost
    port: 5432
    user: dev_user
    password: dev_pass

  sandbox:
    host: vegapay-sandbox-postgres-server.postgres.database.azure.com
    port: 5432
    user: postgres
    password: "${SANDBOX_DB_PASSWORD}"
    # Optionally exclude databases you don't want to query:
    # exclude_databases:
    #   - analytics_readonly
    #   - notifications

  staging:
    host: vegapay-staging-postgres-server.postgres.database.azure.com
    port: 5432
    user: postgres
    password: "${STAGING_DB_PASSWORD}"

  production:
    host: vegapay-prod-postgres-server.postgres.database.azure.com
    port: 5432
    user: app_readonly
    password: "${PROD_DB_PASSWORD}"

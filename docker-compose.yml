services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_pass
      POSTGRES_DB: postgres
    ports:
      - "5434:5432"
    volumes:
      - ./docker/seed/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./docker/seed/users.sql:/docker-entrypoint-initdb.d/02-users.sql
      - ./docker/seed/orders.sql:/docker-entrypoint-initdb.d/03-orders.sql
